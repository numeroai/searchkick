# Local test dependencies. CI installs these natively (see .github/workflows/build.yml);
# this is for running the suite locally.
#
# Two OpenSearch nodes so the multi-cluster tests exercise genuinely separate
# servers rather than one server with different index prefixes. Ports are
# deliberately off the defaults so this does not collide with another project's
# containers.
#
#   docker compose up -d
#   export OPENSEARCH_URL=http://localhost:9250
#   export SECONDARY_OPENSEARCH_URL=http://localhost:9251
#   export REDIS_URL=redis://localhost:6389
#   BUNDLE_GEMFILE=gemfiles/opensearch2.gemfile bundle exec rake test

services:
  opensearch:
    image: opensearchproject/opensearch:2.19.5
    environment:
      discovery.type: single-node
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ulimits:
      memlock: { soft: -1, hard: -1 }
    ports:
      - "9250:9200"

  opensearch-secondary:
    image: opensearchproject/opensearch:2.19.5
    environment:
      discovery.type: single-node
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ulimits:
      memlock: { soft: -1, hard: -1 }
    ports:
      - "9251:9200"

  redis:
    image: redis:8.4-alpine
    ports:
      - "6389:6379"

  # standalone, for the mongoid gemfiles:
  #   MONGODB_HOST=localhost:27018 BUNDLE_GEMFILE=gemfiles/mongoid9.gemfile bundle exec rake test
  mongo:
    image: mongo:7
    ports:
      - "27018:27017"
